name: build-and-test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Self-test (Python tool, C tool, DOS tool logic)
        run: python tests/test_patcher.py

  dos-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: open-watcom/setup-watcom@v1
        with:
          version: "2.0"
          target: "dos"

      - name: Build the 16-bit DOS executable
        run: |
          wcl -zq -bt=dos -ms -os -fe=FIFAFIX.EXE c/fifafix.c
          ls -l FIFAFIX.EXE

      - name: Install DOSBox
        run: |
          sudo apt-get update
          sudo apt-get install -y dosbox

      - name: Run FIFAFIX.EXE in DOSBox against synthetic test files
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python3 tests/dos_test.py prepare dostest
          cp FIFAFIX.EXE dostest/
          # DOSBox must not be able to hang the job: hard timeout, then look at what it produced
          timeout -s KILL 120 dosbox -noconsole -c "mount c $PWD/dostest" -c "c:" -c "RUN.BAT" -c "exit" || echo "::warning::dosbox exit code $?"
          ls -l dostest
          for f in dostest/R*.TXT dostest/DONE.TXT; do [ -f "$f" ] && { echo "--- $f"; cat "$f"; }; done
          python3 tests/dos_test.py verify dostest

      - name: Checksums
        run: sha256sum FIFAFIX.EXE | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FIFAFixer-dos
          path: |
            FIFAFIX.EXE
            SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-tests, dos-build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FIFAFixer-dos
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" FIFAFIX.EXE SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" FIFAFIX.EXE SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "FIFAFIX.EXE is the DOS version of FIFAFixer (16-bit, no extender needed), built from this tag by the workflow and tested in DOSBox. It contains no game files. See README.md for usage; SHA-256 is in SHA256SUMS.txt."
